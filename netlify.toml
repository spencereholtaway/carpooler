[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  autoLaunch = false

# Local `netlify dev` only reads/writes a separate "carpools-dev" Blobs store
# so in-progress schema/migration work on this branch can never touch real
# production data, even by accident. Production and any Netlify-hosted
# branch/preview deploy still default to the real "carpools" store below.
[context.dev.environment]
  CARPOOL_STORE = "carpools-dev"

# Narrow, single-path redirect (not a "/*" catch-all — that broke asset/function
# routing under `netlify dev` earlier) so a direct visit to /admin still loads
# the SPA instead of hitting Netlify's static-file 404.
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

# Belt-and-suspenders alongside the <meta robots> tag and robots.txt — this
# header applies to every response (including non-HTML) so nothing on the
# site gets indexed or crawled.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
